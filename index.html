<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resumen de ruta · sube tu GPX o FIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Archivo:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="uploadScreen">
  <div class="upload-box">
    <div class="kicker">Resumen de tu actividad</div>
    <h1 class="num">Sube tu ruta</h1>
    <p class="sub">Un archivo <b>.gpx</b> o <b>.fit</b> de tu bici, tu carrera o lo que sea. Todo se procesa en tu propio navegador &mdash; el archivo nunca sale de tu ordenador.</p>

    <label class="drop" id="dropZone">
      <input type="file" id="fileInput" accept=".gpx,.fit" hidden>
      <span id="dropLabel">Arrastra tu archivo aquí, o toca para elegirlo</span>
    </label>
    <div id="fileStatus" class="file-status"></div>

    <label class="drop drop-small" id="imgDropZone">
      <input type="file" id="imgInput" accept="image/*" hidden>
      <span id="imgDropLabel">Foto para la portada (opcional) &mdash; si no subes ninguna, usamos el dibujo de tu propia ruta</span>
    </label>
    <div id="imgStatus" class="file-status"></div>

    <button id="generateBtn" class="generate-btn" disabled>Generar mi resumen de ruta</button>
    <div id="errorMsg" class="error-msg"></div>
  </div>
</div>

<div id="stage" class="hidden"></div>

<script type="module" src="app.js"></script>
</body>
</html>
